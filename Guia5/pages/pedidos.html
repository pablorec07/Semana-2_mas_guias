<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <!-- Bootstrap (solo CSS, para estilizar la página y el formulario) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <div class="container py-4" style="max-width: 900px">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <!-- FORMULARIO -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 card-title mb-3">Registrar pedido</h2>
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="inputProducto" class="form-label">Producto</label>
                <input type="text" id="inputProducto" class="form-control" placeholder="Café americano" required />
                <div class="invalid-feedback" id="errorProducto"></div>
              </div>
              <div class="col-md-3">
                <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="inputPrecio" class="form-control" placeholder="2.50" step="0.01" required />
                <div class="invalid-feedback" id="errorPrecio"></div>
              </div>
              <div class="col-md-2">
                <label for="inputCantidad" class="form-label">Cantidad</label>
                <input type="number" id="inputCantidad" class="form-control" placeholder="3" step="1" required />
                <div class="invalid-feedback" id="errorCantidad"></div>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="submit" id="btnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- FILTRO Y ACCIONES -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-start">
            <div class="col-md-4">
              <label for="inputPrecioMax" class="form-label">Precio máximo ($)</label>
              <input type="number" id="inputPrecioMax" class="form-control" placeholder="3.00" step="0.01" />
              <div class="invalid-feedback" id="errorPrecioMax"></div>
            </div>
            <div class="col-md-8 d-flex flex-wrap gap-2 align-items-end" style="min-height: 62px">
              <button type="button" id="btnFiltrar" class="btn btn-outline-primary">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-outline-danger">Limpiar pedidos</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TABLA -->
      <div class="card shadow-sm">
        <div class="card-body">
          <p id="estadoFiltro" class="text-muted small mb-2"></p>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-success">
                <tr>
                  <th scope="col">Producto</th>
                  <th scope="col" class="text-end">Precio unitario</th>
                  <th scope="col" class="text-end">Cantidad</th>
                  <th scope="col" class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="tbodyPedidos"></tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between flex-wrap gap-2 mt-3 fw-bold">
            <span>Total de unidades: <span id="totalUnidades">0</span></span>
            <span>Monto total: <span id="montoTotal">$0.00</span></span>
          </div>
        </div>
      </div>

      <a href="../index.html" class="btn btn-secondary w-100 mt-4">Regresar</a>
    </div>
  </body>
</html>
