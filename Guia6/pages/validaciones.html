
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validación de estudiantes</title>

    <!-- Bootstrap -->
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-2">
                    Ficha de estudiante
                </h2>

                <p class="text-center text-muted mb-4">
                    Validación de datos mediante expresiones regulares
                </p>

                <form id="formEstudiante" novalidate>

                    <div class="row">

                        <!-- CARNET -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Carnet</label>

                            <input
                                type="text"
                                id="inputCarnet"
                                class="form-control"
                                placeholder="AB001">

                            <div class="invalid-feedback" id="errorCarnet"></div>
                        </div>

                        <!-- NOMBRE COMPLETO -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre completo</label>

                            <input
                                type="text"
                                id="inputNombre"
                                class="form-control"
                                placeholder="Juan Pérez López">

                            <div class="invalid-feedback" id="errorNombre"></div>
                        </div>

                        <!-- DUI -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número de DUI</label>

                            <input
                                type="text"
                                id="inputDui"
                                class="form-control"
                                placeholder="12345678-9">

                            <div class="invalid-feedback" id="errorDui"></div>
                        </div>

                        <!-- NIT -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número de NIT</label>

                            <input
                                type="text"
                                id="inputNit"
                                class="form-control"
                                placeholder="1234-123456-123-4">

                            <div class="invalid-feedback" id="errorNit"></div>
                        </div>

                        <!-- FECHA DE NACIMIENTO -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de nacimiento</label>

                            <input
                                type="text"
                                id="inputFecha"
                                class="form-control"
                                placeholder="DD/MM/AAAA">

                            <div class="invalid-feedback" id="errorFecha"></div>
                        </div>

                        <!-- CORREO -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Correo electrónico</label>

                            <input
                                type="text"
                                id="inputCorreo"
                                class="form-control"
                                placeholder="correo@ejemplo.com">

                            <div class="invalid-feedback" id="errorCorreo"></div>
                        </div>

                        <!-- EDAD -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Edad</label>

                            <input
                                type="text"
                                id="inputEdad"
                                class="form-control"
                                placeholder="Ejemplo: 20"
                                inputmode="numeric">

                            <div class="invalid-feedback" id="errorEdad"></div>
                        </div>

                    </div>

                    <!-- BOTONES -->
                    <div class="d-flex gap-2 mt-3">

                        <button
                            type="submit"
                            class="btn btn-success">
                            Validar información
                        </button>

                        <button
                            type="reset"
                            class="btn btn-danger">
                            Limpiar
                        </button>

                    </div>

                </form>

                <!-- RESULTADO -->
                <div id="resultado" class="mt-4" aria-live="polite"></div>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="../js/validaciones.js" defer></script>

</body>
</html>
